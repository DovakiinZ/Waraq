# Builds the Android APK and publishes it to the PUBLIC DovakiinZ/waraq-releases
# repo, which is what https://www.waraq.academy/download reads.
#
# HOW TO RELEASE
#   1. Bump `version:` in ayman_academy_flutter/pubspec.yaml (the +N build number
#      must increase).
#   2. Optional: write student-facing notes (Arabic + English) in
#      ayman_academy_flutter/release_notes/X.Y.Z.md
#   3. Commit, then push a tag:
#        git tag v1.5.0-android        && git push origin v1.5.0-android        # real release
#        git tag v1.5.0-android-test   && git push origin v1.5.0-android-test   # test build (prerelease)
#
# Repo secrets this needs (Settings → Secrets and variables → Actions):
#   RELEASES_TOKEN              fine-grained PAT, Contents: read & write on waraq-releases only
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   ANDROID_DEBUG_KEYSTORE_B64  base64 of the debug.keystore EVERY published APK is signed
#                               with. A different key = the update will not install.
#   ONESIGNAL_APP_ID            optional; omitted → push notifications disabled (as today)

name: Android release

on:
  push:
    tags:
      - 'v*-android'
      - 'v*-android-test'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASES_REPO: DovakiinZ/waraq-releases
  # SHA-256 of the signer of every APK published so far (CLAUDE.md, "Signing").
  EXPECTED_SIGNER_SHA256: 55711ae87fa2800999b7941243d035114067ae9a84149106277fb66f6cced542
  FLUTTER_VERSION: 3.41.6

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ayman_academy_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION=$(echo "$TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-android(-test)?$/\1/p')
          PUB_FULL=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          PUB_VERSION="${PUB_FULL%%+*}"
          BUILD_NUMBER="${PUB_FULL##*+}"
          if [ -z "$TAG_VERSION" ]; then echo "::error::Tag $TAG is not vX.Y.Z-android[-test]"; exit 1; fi
          if [ "$TAG_VERSION" != "$PUB_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but pubspec.yaml says $PUB_VERSION. Bump pubspec first."; exit 1
          fi
          case "$TAG" in *-test) PRE=true ;; *) PRE=false ;; esac
          echo "version=$TAG_VERSION"      >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"            >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          missing=""
          [ -n "$RELEASES_TOKEN" ]    || missing="$missing RELEASES_TOKEN"
          [ -n "$SUPABASE_URL" ]      || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          [ -n "$KEYSTORE" ]          || missing="$missing ANDROID_DEBUG_KEYSTORE_B64"
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing"; exit 1; fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already exists on $RELEASES_REPO. Releases are never overwritten — bump the version."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/ci-signing.keystore
          # Standard Android debug-keystore credentials; the keystore itself is the secret.
          cat > android/key.properties <<'EOF'
          storeFile=ci-signing.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          sed -i 's/^[[:space:]]*//' android/key.properties

      - run: flutter pub get

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          ARGS=(--release
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=WEB_APP_URL=https://www.waraq.academy)
          [ -n "$ONESIGNAL_APP_ID" ] && ARGS+=(--dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID")
          flutter build apk "${ARGS[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "waraq-academy-v${{ steps.meta.outputs.version }}.apk"

      - name: Verify signer and versionCode
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="waraq-academy-v${{ steps.meta.outputs.version }}.apk"

          SIGNER=$("$BT/apksigner" verify --print-certs "$APK" | sed -nE 's/.*SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          echo "Signer: $SIGNER"
          if [ "$SIGNER" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK is signed with the wrong key ($SIGNER). It would not install over existing versions."; exit 1
          fi

          NEW_CODE=$("$BT/aapt2" dump badging "$APK" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          echo "New versionCode: $NEW_CODE"
          # Compare with the newest APK already published (any release, prerelease included).
          PREV_URL=$(gh api "repos/$RELEASES_REPO/releases?per_page=30" \
            --jq '[.[] | select(.draft|not) | {t: .published_at, a: [.assets[] | select(.name|endswith(".apk")) | .browser_download_url][0]} | select(.a)] | sort_by(.t) | last | .a // empty')
          if [ -n "$PREV_URL" ]; then
            curl -sSL -o /tmp/prev.apk "$PREV_URL"
            PREV_CODE=$("$BT/aapt2" dump badging /tmp/prev.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
            echo "Previous versionCode: $PREV_CODE"
            if [ "$NEW_CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode $NEW_CODE is not higher than the published $PREV_CODE. Bump the +N in pubspec.yaml."; exit 1
            fi
          fi

      - name: Release notes
        run: |
          V="${{ steps.meta.outputs.version }}"
          if [ -f "release_notes/$V.md" ]; then
            cp "release_notes/$V.md" notes.md
          else
            echo "::warning::No release_notes/$V.md — using generic notes."
            printf 'تحديث جديد لتطبيق ورق أكاديمي — الإصدار %s.\n\nA new update of the Waraq Academy app — version %s.\n' "$V" "$V" > notes.md
          fi

      - name: Publish to waraq-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V="${{ steps.meta.outputs.version }}"
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            FLAG=--prerelease; TITLE="Waraq Academy — Android v$V (test build)"
          else
            FLAG=--latest;     TITLE="Waraq Academy — Android v$V"
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --target main \
            --title "$TITLE" --notes-file notes.md $FLAG \
            "waraq-academy-v$V.apk#Waraq Academy v$V (Android APK)"

      - name: Keep the APK as a workflow artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waraq-academy-v${{ steps.meta.outputs.version }}
          path: ayman_academy_flutter/waraq-academy-v*.apk
          if-no-files-found: ignore
          retention-days: 30
