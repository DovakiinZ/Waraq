name: ayman_academy_app
description: "Waraq Academy - Arabic-first K-12 educational platform"
publish_to: 'none'
version: 1.1.0+110

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # google_fonts removed: the app bundles IBM Plex Sans Arabic in assets/fonts
  # and must not fetch a font at runtime. See AppTheme._ff.

  # Video
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.2.6

  # Content rendering
  flutter_markdown: ^0.7.3

  # Local storage / cache
  hive_flutter: ^1.1.0

  # Localization / RTL
  intl: any

  # Media
  image_picker: ^1.1.2

  # Certificates
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  path_provider: ^2.1.5
  share_plus: ^12.0.2

  # Charts (teacher dashboard)
  fl_chart: ^0.68.0

  # Notifications
  onesignal_flutter: ^5.1.2

  # Utils
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  webview_flutter: ^4.14.1

  # Brand marks are SVG (assets/brand/)
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/brand/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# App launcher icon, generated from the Waraq brand mark.
# Regenerate with: dart run flutter_launcher_icons
#
# Android gets a proper adaptive icon: the OS masks the foreground over the
# brand green, so the mark must stay inside the central safe zone (which
# icon-foreground.png already does). adaptive_icon_monochrome drives the
# Android 13+ themed-icon treatment.
# ios is false: this project has no ios/ directory.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app-icon.png"
  adaptive_icon_background: "#1E6B52"
  adaptive_icon_foreground: "assets/brand/icon-foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon-monochrome.png"

# Splash screen. Paper ground in light, brand deep green in dark.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F2E8"
  image: assets/brand/splash-mark.png
  color_dark: "#0B3B2C"
  image_dark: assets/brand/splash-mark.png
  android_12:
    color: "#F7F2E8"
    image: assets/brand/splash-mark.png
    color_dark: "#0B3B2C"
    image_dark: assets/brand/splash-mark.png
